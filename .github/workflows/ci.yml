# Runs the backend tests on every push and pull request, on a clean GitHub machine
name: CI

on:
  push:
  pull_request:

# The job only reads the code: its token can't change the repository
permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    # A hung test stops here instead of running for hours
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    # Same database as docker-compose.yml, with the credentials of .env.db.example
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "1234"
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Same version as the Dockerfile
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # Every setting is required: the examples give them a value, the database is on this machine
      - name: Create the env files
        run: |
          cp .env.api.example .env.api
          cp .env.db.example .env.db

      - name: Run the tests
        env:
          DATABASE_HOST: localhost
        run: pytest
